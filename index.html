<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tree Clipper - Binasou Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1d2671 0%, #c33764 100%);
            color: white; text-align: center; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .score-board { font-size: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .tree-btn { width: 120px; height: 120px; border-radius: 50%; font-size: 50px; cursor: pointer; border: 5px solid white; background: #795548; }
        .btn-action { background: #4caf50; color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 20px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="score-board">
        النقاط: <span id="score">0</span> | الخسارات: <span id="losses">0</span>/5
    </div>
    <div id="status" style="margin-bottom: 20px;">جاهز؟ 🪓</div>
    <button class="tree-btn" onclick="chopTree()">🌲</button>
    <button class="btn-action" onclick="inviteFriend()">➕ ادعُ صديقاً</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let score = 0; let losses = 0;
        const AdController = window.Adsgram.init({ blockId: "YOUR_BLOCK_ID_HERE" });

        function chopTree() {
            if (Math.random() < 0.15) {
                losses++;
                document.getElementById('losses').innerText = losses;
                document.getElementById('status').innerText = "خسارة! أصبت غصناً ❌";
                if (losses >= 5) { showAd(); }
            } else {
                score += 10;
                document.getElementById('score').innerText = score;
                document.getElementById('status').innerText = "ضربة رائعة! 🪓";
            }
        }

        function showAd() {
            document.getElementById('status').innerText = "شاهد إعلان للعودة...";
            AdController.show().then(() => {
                losses = 0;
                document.getElementById('losses').innerText = losses;
                document.getElementById('status').innerText = "تمت العودة للعب! ✅";
            }).catch(() => {
                alert("يجب إكمال الإعلان للمتابعة!");
            });
        }

        function inviteFriend() {
            const botLink = "https://t.me/binasou_clipper_bot/start";
            const text = "تحداني في لعبة Tree Clipper! 🌲🪓";
            const url = "https://t.me/share/url?url=" + encodeURIComponent(botLink) + "&text=" + encodeURIComponent(text);
            tg.openTelegramLink(url);
        }
    </script>
</body>
</html>
